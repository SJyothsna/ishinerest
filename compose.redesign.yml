name: istudy-redesign
services:
  postgres:
    image: postgres:16-alpine
    container_name: istudy-redesign-postgres
    profiles: [postgres]
    environment:
      POSTGRES_DB: istudy_redesign
      POSTGRES_USER: istudy
      POSTGRES_PASSWORD: ${ISTUDY_DB_PASSWORD:?Set ISTUDY_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - istudy-redesign-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U istudy -d istudy_redesign"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  istudy-redesign-postgres-data:
    name: istudy-redesign-postgres-data
