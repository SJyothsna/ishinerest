# Application Configuration
app.frontend.url=http://localhost:3000
app.support.email=support@istudy.ie

# Thymeleaf – disable template cache in dev so changes are visible without restart
spring.thymeleaf.cache=false

# AI Question Generation — Gemini API key (free tier)
# Get your free key at: https://aistudio.google.com/app/apikey
# Set via environment variable: export GEMINI_API_KEY=your_key_here
# Or replace the placeholder below for local dev (do NOT commit real keys)
ai.gemini.api-key=${GEMINI_API_KEY:}
# Model name — update here if Google renames it again (no recompile needed)
# gemini-3.5-flash-lite: confirmed in /v1beta/models AND recommended by Google's own error messages
ai.gemini.model=gemini-3.5-flash-lite

