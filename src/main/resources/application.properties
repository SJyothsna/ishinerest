spring.application.name=istudy
spring.profiles.default=local
app.frontend-url=${ISTUDY_FRONTEND_URL:http://localhost:3000}
server.error.include-message=never
server.error.include-stacktrace=never
spring.profiles.group.production=postgres
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.mail.enabled=${ISTUDY_MAIL_ENABLED:false}
app.mail.from=${ISTUDY_MAIL_FROM:support@istudy.ie}
app.generation.live-enabled=false
